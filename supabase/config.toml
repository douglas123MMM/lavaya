# Configuracion Supabase CLI para LavaYa
# Reemplaza project_id con el valor real de tu proyecto en https://app.supabase.com/project/_/settings/general

project_id = "henmnuckpbjywlzhawwg"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://lavaya-admin.vercel.app/auth/callback", "https://lavaya-laundry.vercel.app/auth/callback"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.external.azure]
enabled = false

[edge_runtime]
enabled = true

[analytics]
enabled = false