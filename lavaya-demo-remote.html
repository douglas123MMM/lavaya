<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LavaYa — Tu tiempo vale más</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#2563EB">
<style>
:root{
  --primary:#2563EB; --primary-2:#60A5FA; --dark:#1E40AF; --dark-2:#0A1224;
  --light:#DBEAFE; --light-2:#EFF6FF; --bg:#f4f2ee; --bg-soft:#F6F8FC;
  --text:#1e2b2c; --text-2:#4d5f5e; --text-3:#94A3B8; --border:rgba(30,43,44,.12);
  --success:#0FA968; --danger:#F23D4C; --gold:#F5A623;
  --sh:0 1px 2px rgba(30,43,44,.04),0 4px 16px rgba(30,43,44,.05);
  --sh2:0 2px 6px rgba(30,43,44,.05),0 16px 40px rgba(30,43,44,.10);
  --sh3:0 8px 24px rgba(30,43,44,.08),0 32px 80px rgba(30,43,44,.18);
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0A1224;color:var(--text);line-height:1.5;touch-action:manipulation;-webkit-font-smoothing:antialiased}
#app{width:100%;height:100%;height:100dvh;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
.screen{display:none;flex-direction:column;background:var(--bg);height:100%}
.screen.on{display:flex}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px;padding-bottom:100px}
.scroll::-webkit-scrollbar{display:none}
svg{stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px 22px;border-radius:999px;border:none;font-size:16px;font-weight:700;letter-spacing:-.01em;cursor:pointer;background:var(--primary);color:#fff;font-family:inherit;box-shadow:0 12px 28px rgba(37,99,235,.34),inset 0 1px 0 rgba(255,255,255,.18);transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--light);color:var(--primary);box-shadow:none}
.btn.outline{background:#fff;color:var(--primary);border:1.5px solid var(--primary);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.topbar{display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;background:var(--bg);border-bottom:1px solid var(--border);z-index:5}
.topbar h1{font-size:17px;font-weight:800}
.topbar .sub{font-size:13px;color:var(--text-2)}
.back-btn{width:44px;height:44px;border-radius:50%;border:none;background:var(--light);color:var(--text);font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lbl{font-size:14px;font-weight:700;margin:18px 0 8px}
.input{width:100%;padding:13px 15px;border:1.5px solid var(--border);border-radius:14px;font-size:15px;font-family:inherit;background:var(--bg-soft);color:var(--text);outline:none;transition:.15s}
.input:focus{border-color:var(--primary);background:#fff}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:13px 22px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:var(--sh3);z-index:99;animation:up .25s ease;white-space:nowrap;max-width:90%;text-align:center}
@keyframes up{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* Splash */
#splash{background:radial-gradient(120% 120% at 20% 0%,#12305C 0%,var(--dark) 40%,var(--dark-2) 100%);align-items:center;justify-content:center;z-index:40}
#splash .logo{width:88px;height:88px;border-radius:26px;background:rgba(255,255,255,.08);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;box-shadow:0 24px 60px rgba(0,0,0,.45);animation:pop .7s var(--ease)}
#splash .logo svg{width:46px;height:46px;color:#fff}
#splash .name{color:#fff;font-size:34px;font-weight:800;letter-spacing:-.02em;margin-top:22px;animation:fadeUp .7s .1s var(--ease) both}
#splash .slogan{color:rgba(255,255,255,.6);font-size:15px;margin-top:6px;animation:fadeUp .7s .2s var(--ease) both}

/* Login */
#login{justify-content:flex-end}
.login-top{background:linear-gradient(160deg,var(--primary),var(--primary-2));border-radius:0 0 40px 40px;padding:calc(50px + env(safe-area-inset-top)) 26px 90px;color:#fff}
.login-top .brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800}
.login-top .mk{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center}
.login-top .mk svg{width:22px;height:22px}
.login-top h1{font-size:26px;font-weight:800;margin-top:30px}
.login-top p{opacity:.9;font-size:14px;margin-top:8px}
.login-card{background:#fff;border-radius:26px;padding:24px;margin:-40px 18px 18px;box-shadow:var(--sh3);position:relative;z-index:2}

/* Home */
.greet{padding:calc(26px + env(safe-area-inset-top)) 18px 4px;display:flex;justify-content:space-between;align-items:flex-start}
.greet h2{font-size:23px;font-weight:800}
.greet p{color:var(--text-2);font-size:15px;margin-top:2px}
.bell{width:44px;height:44px;border-radius:50%;background:var(--light);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative}
.bell .dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--danger);border:2px solid #fff}
.hero{margin:18px;background:linear-gradient(160deg,#0F2A57 0%,var(--dark) 55%,var(--dark-2) 100%);border-radius:24px;padding:26px;display:flex;gap:12px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--sh3)}
.hero::before{content:'';position:absolute;top:-60px;right:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(76,141,255,.55),transparent 70%)}
.hero::after{content:'';position:absolute;bottom:-80px;left:-40px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(37,99,235,.5),transparent 70%)}
.hero .eyebrow{display:inline-flex;font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#7FB0FF;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);padding:5px 12px;border-radius:999px;margin-bottom:12px}
.hero h3{font-size:22px;line-height:1.25;font-weight:800;letter-spacing:-.02em}
.hero p{color:rgba(255,255,255,.72);font-size:14px;margin-top:8px}
.hero .btn{margin-top:18px;width:auto;padding:12px 20px;font-size:14px;background:#fff;color:var(--dark);box-shadow:0 12px 28px rgba(0,0,0,.25)}
.hero-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.hero-tags span{background:rgba(255,255,255,.1);color:rgba(255,255,255,.85);font-size:12px;font-weight:600;padding:5px 12px;border-radius:999px}
.hero .ilust{align-self:flex-end;margin-left:auto;z-index:1}
.hero .ilust svg{width:88px;height:88px;color:rgba(255,255,255,.9);stroke-width:1.3}
.sec-title{font-size:17px;font-weight:800;margin:4px 18px 12px;display:flex;justify-content:space-between;align-items:center}
.sec-title .link{font-size:13px;color:var(--primary);font-weight:600;cursor:pointer;padding:8px 4px;display:inline-block;margin:-8px 0}
.svc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 18px;margin-bottom:18px}
.svc-card{background:var(--light);border-radius:16px;padding:16px;cursor:pointer;border:2px solid transparent;transition:.15s}
.svc-card:active{border-color:var(--primary)}
.svc-ico{width:44px;height:44px;border-radius:13px;background:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:10px;box-shadow:var(--sh)}
.svc-ico svg{width:22px;height:22px;color:var(--primary)}
.svc-card h4{font-size:15px;font-weight:700}
.svc-card p{font-size:13px;color:var(--text-2);margin-top:2px}
.cta-wrap{padding:0 18px 18px}

/* Servicios */
.srv-item{display:flex;align-items:center;gap:14px;padding:15px;border:1px solid var(--border);border-radius:15px;margin-bottom:12px;cursor:pointer;background:#fff;box-shadow:var(--sh)}
.srv-item:active{transform:scale(.99);border-color:var(--primary)}
.srv-ico{width:52px;height:52px;border-radius:14px;background:var(--light);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.srv-ico svg{width:24px;height:24px;color:var(--primary)}
.srv-item h4{font-size:16px;font-weight:700}
.srv-item p{font-size:13px;color:var(--text-2);line-height:1.4}
.includes{margin-top:16px;background:var(--light);border-radius:16px;padding:18px}
.includes h4{font-size:15px;font-weight:700;margin-bottom:10px}
.includes li{list-style:none;display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:8px}
.includes li svg{width:18px;height:18px;color:var(--success)}

/* Planes */
.seg{display:flex;background:var(--light);border-radius:26px;padding:4px;margin-bottom:20px}
.seg button{flex:1;padding:10px;border-radius:22px;border:none;background:transparent;font-weight:600;font-size:14px;color:var(--text-2);cursor:pointer;font-family:inherit}
.seg button.on{background:var(--primary);color:#fff;box-shadow:var(--sh2)}
.plan{position:relative;border:1.5px solid var(--border);border-radius:20px;padding:22px;margin-bottom:14px;background:#fff;box-shadow:var(--sh)}
.plan.pop{border-color:var(--primary);box-shadow:var(--sh3)}
.tag{position:absolute;top:-12px;right:20px;background:var(--primary);color:#fff;font-size:12px;font-weight:700;padding:5px 14px;border-radius:999px}
.plan h4{font-size:19px;font-weight:800}
.plan .desc{font-size:13px;color:var(--text-2);margin-top:2px}
.plan .price{margin-top:12px;display:flex;align-items:baseline}
.plan .price b{font-size:34px;font-weight:800;letter-spacing:-1px}
.plan .price span{font-size:14px;color:var(--text-2);margin-left:4px}
.plan ul{margin:14px 0;list-style:none}
.plan li{display:flex;gap:8px;font-size:14px;margin-bottom:9px}
.plan li svg{width:18px;height:18px;color:var(--primary);margin-top:2px}

/* Agendar */
.addr{display:flex;align-items:center;gap:12px;border:1px solid var(--border);border-radius:15px;padding:14px;background:#fff;box-shadow:var(--sh)}
.addr .ico{width:44px;height:44px;border-radius:13px;background:var(--light);display:flex;align-items:center;justify-content:center}
.addr .ico svg{width:22px;height:22px;color:var(--primary)}
.addr b{font-size:15px}
.addr p{font-size:13px;color:var(--text-2);margin-top:2px;line-height:1.4}
.addr .cambiar{color:var(--primary);font-weight:600;font-size:14px;margin-left:auto;cursor:pointer;padding:8px 0 8px 12px;background:none;border:none;font-family:inherit}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border:1.5px solid var(--border);border-radius:15px;margin-bottom:10px;cursor:pointer;background:#fff;font-size:15px;font-weight:500}
.opt svg{width:20px;height:20px;color:var(--text-2)}
.opt.sel{border-color:var(--primary);background:var(--light);font-weight:600}
.opt.sel svg{color:var(--primary)}
.opt .check{margin-left:auto;color:var(--primary);font-weight:700;display:none;font-size:18px}
.opt.sel .check{display:block}
.dt{display:flex;gap:10px;align-items:center;padding:13px;border:1px solid var(--border);border-radius:14px;margin-bottom:10px;font-size:14px;background:#fff}
.dt svg{width:20px;height:20px;color:var(--primary)}

/* Tracking */
.ord-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.ord-head h3{font-size:18px;font-weight:800}
.ord-head p{font-size:13px;color:var(--text-2)}
.status-hero{background:linear-gradient(150deg,var(--light),var(--light-2));border-radius:20px;padding:26px;text-align:center;margin-bottom:20px}
.status-hero .big{width:70px;height:70px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;box-shadow:var(--sh2)}
.status-hero .big svg{width:34px;height:34px;color:var(--primary)}
.status-hero h3{font-size:18px;font-weight:800}
.status-hero p{font-size:13px;color:var(--text-2);margin-top:6px}
.tl-item{display:flex;gap:14px;padding-bottom:26px;position:relative}
.tl-dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--border);background:#fff;flex-shrink:0;z-index:2;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
.tl-item.done .tl-dot{background:var(--primary);border-color:var(--primary)}
.tl-item.active .tl-dot{border:3px solid var(--primary);background:#fff;box-shadow:0 0 0 4px rgba(37,99,235,.12)}
.tl-item:not(:last-child)::before{content:'';position:absolute;left:11px;top:26px;bottom:0;width:2px;background:var(--border)}
.tl-item.done:not(:last-child)::before{background:var(--primary)}
.tl-item h4{font-size:15px;font-weight:600}
.tl-item.active h4{color:var(--primary);font-weight:700}
.tl-item.done h4{color:var(--text)}
.tl-item:not(.done):not(.active) h4{color:var(--text-2)}
.tl-item p{font-size:13px;color:var(--text-2);margin-top:2px}

/* Pedidos */
.ord-card{background:#fff;border:1px solid var(--border);border-radius:15px;padding:16px;margin-bottom:12px;box-shadow:var(--sh);cursor:pointer}
.badge{display:inline-flex;background:var(--light);color:var(--primary);font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px}
.badge.green{background:#E9F9EF;color:var(--success)}
.row{display:flex;justify-content:space-between;align-items:center}

/* Perfil */
.pf-head{background:linear-gradient(160deg,var(--primary),var(--primary-2));padding:calc(46px + env(safe-area-inset-top)) 20px 66px;text-align:center;color:#fff;border-radius:0 0 30px 30px}
.pf-ava{width:80px;height:80px;border-radius:50%;background:#fff;color:var(--primary);font-size:28px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.pf-head h3{font-size:20px;font-weight:800}
.pf-head p{font-size:13px;opacity:.88;margin-top:4px}
.saldo{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--border);border-radius:15px;padding:18px;margin:-28px 18px 0;box-shadow:var(--sh3)}
.saldo small{color:var(--text-2);font-size:13px}
.saldo b{font-size:26px;display:block}
.saldo .btn{width:auto;padding:11px 24px;font-size:14px}
.menu{margin:20px 18px}
.menu-item{display:flex;align-items:center;gap:13px;padding:15px 2px;border-bottom:1px solid var(--border);cursor:pointer}
.menu-item:active{opacity:.6}
.menu-item .ic{width:40px;height:40px;border-radius:12px;background:var(--light);display:flex;align-items:center;justify-content:center}
.menu-item .ic svg{width:20px;height:20px;color:var(--primary)}
.menu-item span{flex:1;font-size:15px;font-weight:500}
.menu-item .val{color:var(--text-2);font-size:13px;flex:0 0 auto}
.menu-item .arr{color:var(--text-3)}

/* Bottom nav */
.bnav{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:406px;background:rgba(255,255,255,.86);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid rgba(30,43,44,.06);border-radius:24px;display:flex;padding:8px;z-index:20;box-shadow:0 12px 40px rgba(30,43,44,.16)}
.bnav button{flex:1;background:none;border:none;font-size:11px;font-weight:700;letter-spacing:.01em;color:var(--text-3);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:inherit;border-radius:18px;padding:6px 0;transition:color .25s var(--ease)}
.bnav button.on{color:var(--primary)}
.bnav .pill{display:flex;align-items:center;justify-content:center;width:44px;height:28px;border-radius:14px;transition:background .25s var(--ease)}
.bnav button.on .pill{background:var(--light)}
.bnav svg{width:22px;height:22px}

.rate{display:flex;gap:8px;justify-content:center;margin:14px 0}
.rate button{font-size:32px;background:none;border:none;cursor:pointer;color:#D8E2EC}
.rate button.on{color:var(--gold)}
.modal{position:fixed;inset:0;background:rgba(11,36,64,.5);display:flex;align-items:center;justify-content:center;z-index:80;backdrop-filter:blur(2px)}
.empty{text-align:center;padding:50px 20px;color:var(--text-2)}
.empty .ic{width:70px;height:70px;border-radius:22px;background:var(--light);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.empty .ic svg{width:32px;height:32px;color:var(--text-3)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.pw-wrap{position:relative}
.pw-toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:13px;font-weight:600;color:var(--primary);cursor:pointer;padding:10px 4px;font-family:inherit}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important}}
/* ===== Premium app frame ===== */
html,body{background:#0A1224}
body{-webkit-text-size-adjust:100%}
#app{max-width:430px;margin:0 auto;box-shadow:0 0 80px rgba(0,0,0,.45)}
.modal{max-width:430px;margin:0 auto}
.screen.on{animation:fadeUp .4s var(--ease)}
.scroll{overscroll-behavior:contain}
.scroll.flat{padding:0 0 100px}
.topbar h1{font-size:18px;letter-spacing:-.02em}
.topbar .sub{font-size:14px}
.greet h2{font-size:25px;letter-spacing:-.02em}
.greet p{font-size:16px}
.hero p{font-size:14px}
.hero-tags span{font-size:12px}
.sec-title{font-size:18px;letter-spacing:-.01em}
.sec-title .link{font-size:14px}
.svc-card h4{font-size:16px;letter-spacing:-.01em}
.svc-card p{font-size:13px}
.srv-item h4{font-size:17px}
.srv-item p{font-size:14px}
.includes li{font-size:15px}
.badge{font-size:12px}
.tag{font-size:12px}
.plan .desc{font-size:14px}
.plan h4{font-size:21px;letter-spacing:-.02em}
.addr p{font-size:14px}
.opt{font-size:16px}
.dt{font-size:15px}
.tl-item p{font-size:14px}
.menu-item span{font-size:16px}
.menu-item .val{font-size:14px}
.bnav button{font-size:11px}
.lbl{font-size:15px}
.input{font-size:16px}
.input-date{flex:1;padding:6px 4px;border:none;background:transparent;font-size:14px;font-family:inherit;color:var(--text);outline:none}
.select-time{flex:1;padding:6px 4px;border:none;background:transparent;font-size:14px;font-family:inherit;color:var(--text);outline:none}
.map-note{display:flex;gap:8px;align-items:flex-start;padding:12px;background:var(--bg-soft);border-radius:12px}
.wlc-ic{width:74px;height:74px;border-radius:26px;background:var(--primary);display:flex;align-items:center;justify-content:center;margin:0 auto 8px;color:#fff}
.wlc-ic svg{width:36px;height:36px;stroke:#fff}
.finger-ring{width:92px;height:92px;border-radius:50%;border:3px solid var(--primary);display:flex;align-items:center;justify-content:center;background:var(--bg-soft);color:var(--primary);animation:fpulse 1.8s ease-in-out infinite}
.finger-ring svg{width:44px;height:44px}
@keyframes fpulse{0%,100%{box-shadow:0 0 0 0 rgba(37,99,235,.25)}50%{box-shadow:0 0 0 16px rgba(37,99,235,0)}}
@media (prefers-reduced-motion:reduce){.finger-ring{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
var LS = "lavaya_v2";
var I = {
  logo:'<svg aria-hidden="true" focusable="false" viewBox="0 0 24 24"><path d="M12 3v13M6 3v13M18 3v13M4 8h16M12 16c-3.5 0-6 2-6 5h12c0-3-2.5-5-6-5Z"/><path d="M12 6a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/></svg>',

  var list=dbPlans.length?dbPlans:P;
  el.innerHTML=list.map(function(p){
    var price=p.price.toFixed(2); var sel=db.plan===p.id;
    return '<div class="plan'+(p.pop?" pop":"")+'">'+(p.pop?'<div class="tag">Popular</div>':'')+
    '<h4>'+p.name+'</h4><div class="desc">'+p.desc+'</div>'+
    '<div class="price"><b>$'+price+'</b><span>/mes</span></div>'+
    '<ul>'+p.f.map(function(ft){return '<li>'+I.check+ft+'</li>'}).join("")+'</ul>'+
    '<button class="btn '+(sel?"outline":"")+'" data-plan="'+p.id+'">'+(sel?"Plan activado ✓":"Elegir plan")+'</button></div>';
  }).join("");
}

var realOrders=[];
function onAuth(){
  if(!st.user)return;
  var hn=$("#h-name"); if(hn)hn.textContent=st.user.nombre;
  renderOrdersReal();
}
function renderOrdersReal(){
  if(!st.token){return}
  apiGet("/api/orders").then(function(d){ realOrders=d.orders||[]; renderOrders(); }).catch(function(){});
}
function renderOrders(){
  var el=$("#orders-body"); if(!el) return;
  var list=realOrders.length?realOrders:db.orders;
  if(list.length===0){el.innerHTML='<div class="empty"><div class="ic">'+I.receipt+'</div>Aún no tienes pedidos</div>';return}
  var lbl={PENDIENTE:"Pendiente",CONFIRMADO:"Confirmado",RECOGIDO:"Recogido",EN_LAVADO:"Lavando",PLANCHADO:"Planchando",EN_ENTREGA:"En camino",ENTREGADO:"Entregado",CANCELADO:"Cancelado"};
  el.innerHTML=list.map(function(o){
    var stt=o.status||"PENDIENTE"; var s=lbl[stt]||stt;
    return '<div class="ord-card" data-track="'+o.id+'" tabindex="0" role="button">'+
    '<div class="row" style="margin-bottom:10px"><b>Pedido #'+o.id.slice(-6).toUpperCase()+'</b><span class="badge'+(stt==="ENTREGADO"?" green":"")+'">'+s+'</span></div>'+
    '<div style="font-size:13px;color:var(--text-2)">'+ (o.servicio||"Lavar") +' • '+(o.pesoEstimado||0)+' kg</div>'+
    '<div style="font-size:13px;color:var(--text-2);margin-top:4px">'+(o.fechaRetiro||"")+' • '+(o.horaRetiro||"")+'</div>'+
    '<div class="row" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">'+
    '<b style="font-size:17px">$'+Number(o.costoTotal||0).toFixed(2)+'</b>'+
    '<span style="color:var(--primary);font-weight:600;font-size:13px">Ver seguimiento →</span>'+
    '</div></div>';
  }).join("");
}

function renderTracking(){
  var el=$("#tracking-body"); if(!el) return;
  var o=st.cur?realOrders.find(function(x){return x.id===st.cur}):realOrders[0];
  if(!o){el.innerHTML='<div class="empty"><div class="ic">'+I.receipt+'</div>No hay pedidos</div>';return}
  var stepMap={PENDIENTE:0,CONFIRMADO:1,RECOGIDO:2,EN_LAVADO:3,PLANCHADO:4,EN_ENTREGA:5,ENTREGADO:6};
  var step=stepMap[o.status]!==undefined?stepMap[o.status]:1;
  var t=F[step].t;
  el.innerHTML='<div class="ord-head"><div><h3>Pedido #'+o.id.slice(-6).toUpperCase()+'</h3><p>'+(o.fechaRetiro||'')+' • '+(o.horaRetiro||'')+'</p></div><span class="badge">'+(o.servicio||'Lavar')+'</span></div>'+
  '<div class="status-hero"><div class="big">'+I.bike+'</div><h3>'+t+'</h3><p>Nuestro equipo está gestionando tu pedido.</p></div>'+
  '<div>'+F.map(function(f,i){
    var cls=i<step?"done":(i===step?"active":""); var mk=i<step?"✓":(i+1);
    return '<div class="tl-item '+cls+'"><div class="tl-dot">'+mk+'</div><div><h4>'+f.t+'</h4><p>'+(i<=step?f.time:"Pendiente")+'</p></div></div>';
  }).join("")+'</div>'+
  '<button class="btn" data-go="orders">Ver mis pedidos</button>'+
  '<button class="btn ghost" data-go="support" style="margin-top:10px">Contactar soporte</button>';
}

function rate(){
  var o=st.cur?db.orders.find(function(x){return x.id===st.cur}):db.orders[0];
  var stars=""; for(var i=1;i<=5;i++) stars+='<button data-n="'+i+'">★</button>';
  var m=document.createElement("div"); m.className="modal";
  m.innerHTML='<div style="background:#fff;border-radius:22px;padding:24px;width:88%;max-width:340px;text-align:center">'+
  '<h3 style="margin-bottom:6px">Califica tu servicio</h3><p style="color:var(--text-2);font-size:14px">¿Cómo te pareció LavaYa?</p>'+
  '<div class="rate">'+stars+'</div><button class="btn" id="rate-ok">Enviar</button></div>';
  document.body.appendChild(m);
  var n=5;
  m.querySelectorAll(".rate button").forEach(function(b){b.addEventListener("click",function(){n=+b.getAttribute("data-n");m.querySelectorAll(".rate button").forEach(function(x,i){x.classList.toggle("on",i<n)})})});
  m.querySelector("#rate-ok").addEventListener("click",function(){if(o){o.status="delivered";o.step=F.length-1;o.rating=n;save()}m.remove();renderTracking();renderOrders();toast("¡Gracias por tu calificación!")});
  m.addEventListener("click",function(e){if(e.target===m)m.remove()});
}

function previewPrice(){
  var el=$("#price-preview"); if(!el)return;
  if(!st.sel){el.innerHTML="Selecciona un servicio para ver el costo.";return}
  var kg=parseFloat($("#kg").value||"5");
  var tar={lavar:2,planchar:2.5,["lavar-planchar"]:4,solo:2.5};
  var svc=S.find(function(s){return s.id===st.sel});
  var total=(tar[st.sel]||2)*kg;
  el.innerHTML='<b>'+svc.name+'</b> — '+kg+' kg × $'+tar[st.sel].toFixed(2)+'/kg = <b style="color:var(--primary)">$'+total.toFixed(2)+'</b>'+(st.addr?'':'<br><span style="color:var(--danger,#d33)">Agrega tu dirección para continuar.</span>');
}

function bind(){
  document.addEventListener("click",function(e){
    var planBtn=e.target.closest("[data-plan]");
    if(planBtn){ db.plan=planBtn.getAttribute("data-plan"); save(); renderPlans(); var pf=$("#pf-plan"); if(pf)pf.textContent=dbPlans.find(function(x){return x.id===db.plan}).name; toast("Plan activado correctamente (demo)"); return; }
    var go=e.target.closest("[data-go]"); if(go){ var id=go.getAttribute("data-go"); if(id==="tracking")renderTracking(); if(id==="orders")renderOrdersReal(); show(id); return; }
    var tab=e.target.closest("[data-tab]"); if(tab){ if(tab.getAttribute("data-tab")==="orders")renderOrdersReal(); document.querySelectorAll(".bnav button").forEach(function(b){b.classList.remove("on")}); tab.classList.add("on"); show(tab.getAttribute("data-tab")); return; }
  });
  document.addEventListener("keydown",function(e){if(e.key!=="Enter"&&e.key!==" ")return;var t=e.target.closest('[data-go],[data-tab],[data-svc],[data-track],[data-plan],[role="button"]');if(t){e.preventDefault();t.click();}});
  document.querySelectorAll("[data-soon]").forEach(function(el){el.addEventListener("click",function(){toast("Disponible próximamente")})});
  $("#btn-pass").addEventListener("click",function(){var i=$("#l-pass");var s=i.type==="password";i.type=s?"text":"password";this.textContent=s?"Ocultar":"Mostrar";});
  $("#btn-login").addEventListener("click",function(){
    var ced=$("#l-cedula").value.trim(),pw=$("#l-pass").value;
    if(!ced||!pw){toast("Ingresa tu cédula y contraseña");return}
    var b=this; b.textContent="Ingresando...";
    apiPost("/api/auth/login",{cedula:ced,password:pw}).then(function(d){
      st.user=d.user; saveToken(d.token);
      db.user={name:d.user.nombre,email:d.user.email}; save();
      localStorage.setItem("lavaya_user",JSON.stringify(d.user));
      b.textContent="Iniciar sesión"; onAuth(); show("home"); toast("Bienvenido, "+d.user.nombre);
    }).catch(function(err){b.textContent="Iniciar sesión";toast(err.message||"Error al iniciar sesión")});
  });
  $("#btn-reg").addEventListener("click",function(){show("register")});
  $("#btn-register").addEventListener("click",function(){
    var ced=$("#r-cedula").value.trim(),nom=$("#r-nombre").value.trim(),em=$("#r-email").value.trim(),tel=$("#r-tel").value.trim(),pw=$("#r-pass").value;
    if(!ced||!nom||!em||!tel||!pw){toast("Completa todos los campos");return}
    var b=this; b.textContent="Creando cuenta...";
    apiPost("/api/auth/register",{cedula:ced,nombre:nom,email:em,telefono:tel,password:pw}).then(function(d){
      st.user=d.user; saveToken(d.token); db.user={name:d.user.nombre,email:d.user.email}; save();
      localStorage.setItem("lavaya_user",JSON.stringify(d.user));
      b.textContent="Crear mi cuenta"; onAuth(); show("home"); toast("¡Cuenta creada, bienvenido!");
    }).catch(function(err){b.textContent="Crear mi cuenta";toast(err.message||"Error al crear cuenta")});
  });
  $("#btn-notif").addEventListener("click",function(){toast("No tienes notificaciones nuevas")});
  $("#svc-opts").addEventListener("click",function(e){var o=e.target.closest("[data-svc]");if(!o)return;st.sel=o.getAttribute("data-svc");document.querySelectorAll(".opt").forEach(function(x){x.classList.remove("sel")});o.classList.add("sel");if(st.addr){$("#btn-confirm").disabled=false}previewPrice()});
  $("#kg").addEventListener("input",function(){previewPrice()});
  $("#btn-save-addr").addEventListener("click",function(){
    var dir=$("#ad-direccion").value.trim(),ref=$("#ad-ref").value.trim(),tipo=$("#ad-tipo").value;
    if(!dir){toast("Ingresa tu dirección");return}
    if(!st.token){toast("Inicia sesión para guardar tu dirección");return}
    var b=this;b.textContent="Guardando...";
    apiPost("/api/addresses",{direccion:dir,referencia:ref,tipo:tipo,lat:10.4806,lng:-66.9036,esPrincipal:true}).then(function(d){
      st.addr={direccion:d.address.direccion,referencia:d.address.referencia,id:d.address.id};
      $("#addr-title").textContent=d.address.direccion;$("#addr-sub").textContent=d.address.referencia||"Toca para cambiar";
      b.textContent="Guardar dirección"; if(st.sel){$("#btn-confirm").disabled=false} show("schedule"); toast("Dirección guardada");
    }).catch(function(err){b.textContent="Guardar dirección";toast(err.message||"Error al guardar dirección")});
  });
  $("#btn-confirm").addEventListener("click",function(){
    if(!st.addr){toast("Agrega tu dirección para continuar");show("addrmodal");return}
    var svc=S.find(function(s){return s.id===st.sel});
    var svcMap={lavar:"LAVAR",planchar:"PLANCHAR",["lavar-planchar"]:"AMBOS",solo:"PLANCHAR"};
    var kg=parseFloat($("#kg").value||"5");
    var fecha=$("#sched-date").value,hora=$("#sched-time").value,notas=$("#notes").value;
    if(!st.token){toast("Inicia sesión para agendar");return}
    var b=this;b.textContent="Confirmando...";
    apiPost("/api/orders",{addressId:st.addr.id,servicio:svcMap[st.sel]||"LAVAR",pesoEstimado:kg,fechaRetiro:fecha,horaRetiro:hora,notas:notas}).then(function(d){
      b.textContent="Confirmar servicio"; st.cur=d.order.id; st.sel=null;
      renderOrdersReal(); show("tracking"); toast("¡Pedido confirmado!");
    }).catch(function(err){b.textContent="Confirmar servicio";toast(err.message||"Error al confirmar")});
  });
  $("#btn-recarga").addEventListener("click",function(){db.saldo+=10;save();var el=document.querySelector(".saldo b");if(el)el.textContent="$"+db.saldo.toFixed(2);toast("Saldo recargado +$10.00 (demo)")});
  $("#btn-send").addEventListener("click",function(){var s=$("#sup-subject").value,m=$("#sup-msg").value;if(!s||!m){toast("Completa asunto y mensaje");return}$("#sup-subject").value="";$("#sup-msg").value="";toast("Mensaje enviado")});
  document.querySelectorAll(".seg button").forEach(function(b){b.addEventListener("click",function(){document.querySelectorAll(".seg button").forEach(function(x){x.classList.remove("on")});b.classList.add("on");st.per=b.getAttribute("data-per");renderPlans()})});
  $("#orders-body").addEventListener("click",function(e){var c=e.target.closest("[data-track]");if(c){st.cur=c.getAttribute("data-track");renderTracking();show("tracking")}});
  loadPlans(); if(st.user){onAuth()}
  startFinger();
}

function startFinger(){
  $("#btn-start").addEventListener("click",function(){show("register")});
  $("#btn-signin").addEventListener("click",function(){show("login")});
  $("#btn-logout").addEventListener("click",function(){saveToken(null);localStorage.removeItem("lavaya_user");window._fm=1;st.user=null;show("login")});
}

build();
setTimeout(function(){
  if(st.user){
    show("finger"); doFinger();
  } else {
    show("welcome");
  }
},1400);

function doFinger(){
  var msg=$("#finger-msg"); if(!msg)return;
  msg.textContent="Reconociendo...";
  try{
    localStorage.setItem("lavaya_biometric","ok");
    setTimeout(function(){ onAuth(); show("home"); toast("¡Hola de nuevo!"); },1200);
  }catch(e){ show("home"); }
}
</script>
</body>
</html>
